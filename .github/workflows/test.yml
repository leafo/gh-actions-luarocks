name: test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - run: npm ci --omit=dev
    - run: git diff --exit-code -- package-lock.json node_modules
    - run: npm test
    - run: npm audit --omit=dev

  test:
    strategy:
      fail-fast: false
      matrix:
        luaVersion: ["5.1.5", "5.2.4", "5.3.6", "5.5", "luajit-2.1", "luajit-master", "luajit-openresty", "5.1", "5.4"]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: leafo/gh-actions-lua@master
      with:
        luaVersion: ${{ matrix.luaVersion }}

    - uses: ./

    - name: test lua
      run: lua -e 'print("hi from lua")'

    - name: test luarocks
      run: |
        echo $PATH
        env | grep LUA
        luarocks
        luarocks path
        luarocks install moonscript
        lua -e 'require("moon").p({1,2,3})'

  test-luarocks-2:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: leafo/gh-actions-lua@master
      with:
        luaVersion: "5.2"

    - uses: ./
      with:
        luaRocksVersion: "2.4.4"

    - name: test luarocks
      run: |
        luarocks --version
        luarocks path
        luarocks install moonscript
        lua -e 'require("moon").p({1,2,3})'

  test-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: leafo/gh-actions-lua@master
      with:
        luaVersion: "5.4"
    - uses: ./

    - name: test luarocks
      run: |
        echo $PATH
        env | grep LUA
        luarocks
        luarocks path
        luarocks install moonscript
        lua -e 'require("moon").p({1,2,3})'

  test-openresty:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: leafo/gh-actions-openresty@main
    - uses: ./
      with:
        withLuaPath: "/usr/local/openresty/luajit/"

    - name: test luarocks
      run: |
        echo $PATH
        env | grep LUA
        luarocks
        luarocks path
        luarocks install pgmoon
